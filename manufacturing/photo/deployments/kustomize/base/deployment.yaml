apiVersion: apps/v1
kind: Deployment
metadata:
  name: photo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: photo
  template:
    metadata:
      labels:
        app: photo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: photo
        image: photo:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: APP_VERSION
          value: "1.0.0"
        - name: APP_IMAGE
          value: "photo:latest"
        - name: TEXT_COLOR
          value: "#FFFFFF"
        - name: BG_COLOR
          value: "#2C3E50"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 64Mi