apiVersion: apps/v1
kind: Deployment
metadata:
  name: #{Octopus.Project.Name | ToLower | Replace " " "-"}-#{Octopus.Environment.Name | ToLower}
  namespace: #{Kubernetes.Namespace}
  labels:
    app: #{Octopus.Project.Name | ToLower | Replace " " "-"}-#{Octopus.Environment.Name | ToLower}
spec:
  replicas: #{Kubernetes.Replicas}
  selector:
    matchLabels:
      app: #{Octopus.Project.Name | ToLower | Replace " " "-"}-#{Octopus.Environment.Name | ToLower}
  template:
    metadata:
      labels:
        app: #{Octopus.Project.Name | ToLower | Replace " " "-"}-#{Octopus.Environment.Name | ToLower}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: #{Octopus.Project.Name | ToLower | Replace " " "-"}
        image: #{Docker.Image}:#{Octopus.Release.Number}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: APP_VERSION
          value: "#{Octopus.Release.Number}"
        - name: APP_IMAGE
          value: "#{Docker.Image}:#{Octopus.Release.Number}"
        - name: PORT
          value: "8080"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          limits:
            cpu: #{Kubernetes.Resources.Limits.Cpu}
            memory: #{Kubernetes.Resources.Limits.Memory}
          requests:
            cpu: #{Kubernetes.Resources.Requests.Cpu}
            memory: #{Kubernetes.Resources.Requests.Memory}