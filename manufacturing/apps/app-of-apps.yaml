apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: it-manufacturing-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://gitea:3000/admin/manufacturing-apps.git
    targetRevision: HEAD
    path: it-manufacturing-apps
    directory:
      recurse: true
      include: '*/*/*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m