apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: photo-production-mmp
  annotations:
    argo.octopus.com/project: "photo"
    argo.octopus.com/environment: "production"
    argo.octopus.com/tenant: "mmp"
    argo.octopus.com/image-replace-paths: "gitea:3000/admin/photo:{{ .Values.photo.image.tag }}"
spec:
  project: default
  source:
    repoURL: http://gitea:3000/admin/manufacturing-configs.git
    targetRevision: HEAD
    path: north-america/mmp/production/photo
  destination:
    namespace: photo-production-mmp
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - Validate=false
      - CreateNamespace=true
