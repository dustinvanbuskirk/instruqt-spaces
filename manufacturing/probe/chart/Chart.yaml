apiVersion: v2
name: probe
description: >-
  This file is an Octostache template -- Octopus's "Update Argo CD Application
  Manifests" step renders it (reading it directly from this repo, not a
  package) and overwrites each tenant/environment's actual Chart.yaml,
  substituting version and appVersion. values.yaml and templates/ in this
  repo are plain, untouched files -- the image tag now comes from this
  chart's own appVersion (see templates/deployment.yaml's
  `.Values.image.tag | default .Chart.AppVersion`), not a hardcoded values.yaml
  field.
type: application
version: "#{Octopus.Release.Number}"
appVersion: "#{Octopus.Release.Number}"
